<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at 8% 5%, #a8dfc2 0, transparent 42%),
        radial-gradient(ellipse at 95% 95%, #39aa9b 0, transparent 45%),
        #f5fbf8;
      color: #142a29;
    }

    .login-card {
      width: min(380px, calc(100% - 40px));
      padding: 40px 42px 30px;
      text-align: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 12px 35px rgba(27, 94, 78, 0.12);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      height: 60px;
      margin-bottom: 22px;
      padding: 0 18px;
      border: 1px solid rgba(38, 111, 93, 0.08);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.78);
      box-shadow:
        inset 2px 2px 7px rgba(31, 80, 69, 0.08),
        2px 3px 8px rgba(31, 80, 69, 0.08);
      font-size: 18px;
      text-align: center;
    }

    input::placeholder {
      color: #858b89;
    }

    input:focus {
      border-color: #54b89a;
      box-shadow: 0 0 0 3px rgba(84, 184, 154, 0.2);
    }

    button {
      width: 100%;
      height: 58px;
      margin-top: 2px;
      border: 0;
      border-radius: 30px;
      background: #70c9ad;
      color: #123a35;
      font-size: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #55b99a;
      transform: translateY(-1px);
    }

    .forgot {
      margin: 26px 0 0;
      color: #8b9994;
      font-size: 15px;
    }

    .forgot a {
      color: #142a29;
      font-weight: bold;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>LOGIN</h1>

    <form action="#" method="post">
      <input
        type="text"
        name="username"
        placeholder="Username"
        aria-label="Username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Password"
        aria-label="Password"
        required
      >

      <button type="submit">SIGN IN</button>
    </form>

    <p class="forgot">Forgot Password? <a href="#">Click Here</a></p>
  </main>
</body>
</html>
